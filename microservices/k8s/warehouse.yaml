apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-warehouse
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: service-warehouse
  template:
    metadata:
      labels:
        app: service-warehouse
    spec:
      containers:
      - name: service-warehouse
        image: logistics-warehouse:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: PORT
          value: "8082"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: warehouse_db
        - name: DB_USER
          value: user
        - name: DB_PASSWORD
          value: password
        - name: REDIS_URL
          value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: service-warehouse
spec:
  type: NodePort 
  selector:
    app: service-warehouse
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082