apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-shipment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-shipment
  template:
    metadata:
      labels:
        app: service-shipment
    spec:
      containers:
      - name: service-shipment
        image: logistics-shipment:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: shipment_db
        - name: DB_USER
          value: user
        - name: DB_PASSWORD
          value: password
        - name: WAREHOUSE_SERVICE_URL
          value: http://service-warehouse:8082
        - name: ROUTING_SERVICE_URL
          value: http://service-routing:8083
---
apiVersion: v1
kind: Service
metadata:
  name: service-shipment
spec:
  type: NodePort
  selector:
    app: service-shipment
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081